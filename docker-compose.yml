version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MAX_CONCURRENT_DSP_TASKS=2
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    restart: unless-stopped
